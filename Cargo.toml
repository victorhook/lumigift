# Host-side workspace: shared no_std protocol crates + desktop software.
# Firmware lives in firmware/* as separate workspaces (different targets).
[workspace]
resolver = "3"
members = [
    "crates/nrf24-usb-proto",
    "crates/lumigift-proto",
    "crates/lumigift-fx",
    "crates/nrf24",
    "host/nrf24-usb",
    "host/lumigift-core",
    "host/lumigift-audio",
    "host/lumigift-cli",
    "host/lumigift-studio",
    "host/lumigift-stage",
]
exclude = ["firmware"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

# GUI stack shared by lumigift-studio and lumigift-stage (keep versions in lockstep).
[workspace.dependencies]
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_extras = "0.37"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }

[profile.release]
debug = 1

# Keep dependencies (wgpu, symphonia, rustfft) fast in debug builds.
[profile.dev.package."*"]
opt-level = 2
