[package]
name = "nrf24-usb-bridge"
description = "Generic nRF24L01+ <-> USB bridge firmware (STM32F103C8)"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
nrf24 = { path = "../../crates/nrf24" }
nrf24-usb-proto = { path = "../../crates/nrf24-usb-proto" }

embassy-stm32 = { version = "0.6", features = ["stm32f103c8", "time-driver-tim2", "exti", "memory-x"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
embassy-usb = { version = "0.6", default-features = false, features = ["max-interface-count-1", "max-handler-count-1"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = "2"
embedded-hal = "1.0"
cortex-m = { version = "0.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7"
panic-halt = "1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
incremental = false

[profile.dev]
opt-level = 1
