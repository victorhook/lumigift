[package]
name = "lumigift-studio"
description = "Lumigift Studio: fleet monitor, show editor, 3D stage and firmware updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jiff = "0.2"
lumigift-core = { path = "../lumigift-core" }
lumigift-audio = { path = "../lumigift-audio" }
lumigift-proto = { path = "../../crates/lumigift-proto" }
lumigift-fx = { path = "../../crates/lumigift-fx" }
lumigift-stage = { path = "../lumigift-stage" }
glam = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
png = "0.18"
log = "0.4"
env_logger = "0.11"
