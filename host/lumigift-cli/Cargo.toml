[package]
name = "lumigift-cli"
description = "Headless command-line tool for Lumigift (status, blink, slots, OTA, ...)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lumigift"
path = "src/main.rs"

[dependencies]
lumigift-core = { path = "../lumigift-core" }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
